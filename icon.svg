<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2740"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#7b8cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#26324b" stroke-width="4"/>

  <!-- waveform -->
  <g filter="url(#glow)" stroke="url(#acc)" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M96 256 L96 256"/>
    <path d="M120 210 V302"/>
    <path d="M164 150 V362"/>
    <path d="M208 196 V316"/>
    <path d="M252 110 V402"/>
    <path d="M296 182 V330"/>
    <path d="M340 140 V372"/>
    <path d="M384 204 V308"/>
    <path d="M424 232 V280"/>
  </g>

  <!-- fones -->
  <path d="M104 300 a152 152 0 0 1 304 0" fill="none" stroke="#e8eefb" stroke-width="26" stroke-linecap="round"/>
  <rect x="76" y="292" width="60" height="104" rx="30" fill="#e8eefb"/>
  <rect x="376" y="292" width="60" height="104" rx="30" fill="#e8eefb"/>
</svg>
